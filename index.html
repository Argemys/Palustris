function renderCorineBlock(container){
  container.innerHTML = '';
  const ref = getCorineReferentiel();
  const habitats = getVal('corine_habitats')||[];

  const importRow = el('div',{class:'hint'}, ref.length
    ? `Référentiel CORINE chargé : ${ref.length} entrées.`
    : 'Aucun référentiel CORINE importé — recherche indisponible, saisie manuelle du code/libellé ci-dessous.');
  container.appendChild(importRow);

  const fileLabel = el('label',{class:'btn btn-outline', style:'cursor:pointer;'}, '📥 Importer un référentiel CORINE (JSON)');
  const fileInput = el('input',{type:'file', accept:'.json', style:'display:none;'});
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error('format');
        setCorineReferentiel(data);
        toast('Référentiel CORINE importé ('+data.length+' entrées)');
        renderCorineBlock(container);
      }catch(err){ toast('Fichier invalide — attendu : [{"code":"...","libelle":"..."}]'); }
    };
    reader.readAsText(file);
  });
  fileLabel.appendChild(fileInput);
  container.appendChild(fileLabel);

  const searchInput = el('input',{type:'text', placeholder:'Rechercher par code ou intitulé…', autocomplete:'off'});
  container.appendChild(fieldWrap('Rechercher dans le référentiel', null, searchInput));
  const results = el('div',{style:'position:relative; z-index:20;'});
  container.appendChild(results);

  const searchRow = el('div',{class:'searchrow', style:'margin-top:10px;'});
  const codeInput = el('input',{type:'text', placeholder:'Code', style:'max-width:100px;'});
  const libelleInput = el('input',{type:'text', placeholder:'Libellé (auto si trouvé, sinon à saisir)'});
  searchRow.appendChild(codeInput);
  searchRow.appendChild(libelleInput);
  container.appendChild(searchRow);

  const normalize = value => String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

  searchInput.addEventListener('input', ()=>{
    results.innerHTML = '';
    const q = normalize(searchInput.value);
    if(!q || ref.length===0) return;

    const matches = ref.map(r=>{
      const code = normalize(r.code);
      const libelle = normalize(r.libelle);
      const isCodeQuery = /^[0-9]+(?:\.[0-9]+)*$/.test(q);
      const starts = isCodeQuery ? code.startsWith(q) : (code.startsWith(q) || libelle.startsWith(q));
      const contains = isCodeQuery ? code.includes(q) : (code.includes(q) || libelle.includes(q));
      return {r, starts, contains};
    }).filter(x=>x.starts || x.contains)
      .sort((a,b)=>{
        if(a.starts!==b.starts) return a.starts ? -1 : 1;
        return normalize(a.r.code).localeCompare(normalize(b.r.code), undefined, {numeric:true});
      })
      .slice(0,30);

    if(!matches.length) return;

    const list = el('div',{style:'background:#fff; border:1px solid var(--line); border-radius:7px; box-shadow:0 3px 8px rgba(0,0,0,.12); overflow-y:auto; max-height:280px; margin-top:-8px; margin-bottom:8px;'});
    matches.forEach(({r})=>{
      const item = el('div',{class:'chk', style:'cursor:pointer; padding:8px 10px; border-bottom:1px solid var(--line);'}, r.code+' — '+r.libelle);
      item.addEventListener('click', ()=>{
        const current = getVal('corine_habitats')||[];
        if(current.some(h=>h.code===r.code)){ toast('Habitat déjà ajouté'); return; }
        current.push({code:r.code, libelle:r.libelle});
        setVal('corine_habitats', current);
        searchInput.value=''; results.innerHTML='';
        renderCorineBlock(container);
      });
      list.appendChild(item);
    });
    results.appendChild(list);
  });

  container.appendChild(el('div',{class:'hint', style:'margin-top:8px;'},'Habitat introuvable dans le référentiel ? Saisis le code/libellé manuellement ci-dessous.'));

  const addBtn = el('button',{class:'btn btn-primary', type:'button', style:'margin-top:6px;'}, '+ Ajouter cet habitat');
  addBtn.addEventListener('click', ()=>{
    if(!codeInput.value.trim()){ toast('Renseigner au moins un code'); return; }
    const list = getVal('corine_habitats')||[];
    list.push({code:codeInput.value.trim(), libelle:libelleInput.value.trim()});
    setVal('corine_habitats', list);
    codeInput.value=''; libelleInput.value='';
    renderCorineBlock(container);
  });
  container.appendChild(addBtn);

  // Habitats retenus, chacun avec son recouvrement (% de l'entité humide) et ses espèces typiques
  const tags = el('div',{style:'margin-top:10px;'});
  const total = el('div',{class:'hint'});
  // Réglet : chaque habitat occupe sa part de l'entité humide, graduations tous les 10 %
  const reglet = el('div',{class:'reglet'});
  const regletBar = el('div',{class:'reglet-bar', role:'img'});
  reglet.appendChild(regletBar);
  reglet.appendChild(el('div',{class:'reglet-scale'}, el('span',{},'0'), el('span',{},'50'), el('span',{},'100 %')));
  function refreshReglet(list){
    regletBar.innerHTML = '';
    const sum = list.reduce((a,h)=>a+(parseFloat(h.recouvrement)||0),0);
    reglet.hidden = !list.length;
    reglet.classList.toggle('over', sum>100);
    list.forEach((h,i)=>{
      const v = parseFloat(h.recouvrement)||0;
      if(v<=0) return;
      const seg = el('div',{}, v>=12 ? h.code : '');
      seg.style.width = Math.min(v, 100)+'%';
      // nuances de la couleur de la rubrique (mélange avec du blanc), calculées ici pour les anciens Safari
      const base = (SECTIONS.find(x=>x.id==='especes')||{}).accent || '#4F7A2E', w = (i%3)*0.28;
      const c = [1,3,5].map(j=>Math.round(parseInt(base.slice(j,j+2),16)*(1-w) + 255*w));
      seg.style.background = 'rgb('+c.join(',')+')';
      regletBar.appendChild(seg);
    });
    regletBar.setAttribute('aria-label', 'Recouvrements : '+list.map(h=>h.code+' '+(h.recouvrement||0)+' %').join(', '));
  }
  function refreshTotal(){
    const list = getVal('corine_habitats')||[];
    refreshReglet(list);
    if(!list.length){ total.textContent=''; return; }
    const sum = list.reduce((acc,h)=>acc+(parseFloat(h.recouvrement)||0),0);
    total.textContent = 'Total recouvrement : '+sum+' %'+(sum===100 ? ' ✓' : ' (attendu : 100 %)');
    total.style.color = sum===100 ? '' : '#b45309';
  }
  habitats.forEach((h,idx)=>{
    const row = el('div',{class:'habitat-row'});
    row.appendChild(el('span',{class:'habitat-label'}, el('b',{}, h.code), h.libelle||''));
    const pct = el('input',{type:'number', min:'0', max:'100', step:'1', inputmode:'numeric', placeholder:'%', title:'Recouvrement dans l\'entité humide (%)'});
    if(h.recouvrement!=null && h.recouvrement!=='') pct.value = h.recouvrement;
    pct.addEventListener('input', ()=>{
      const list = getVal('corine_habitats')||[];
      if(!list[idx]) return;
      list[idx].recouvrement = pct.value==='' ? '' : Number(pct.value);
      setVal('corine_habitats', list);
      refreshTotal();
    });
    row.appendChild(pct);
    row.appendChild(el('span',{},'%'));
    const rm = el('button',{type:'button', class:'habitat-rm', title:'Retirer cet habitat'}, '×');
    rm.addEventListener('click', ()=>{
      const list = getVal('corine_habitats')||[];
      list.splice(idx,1);
      setVal('corine_habitats', list);
      renderCorineBlock(container);
    });
    row.appendChild(rm);
    tags.appendChild(row);
    const sugg = renderEspecesTypiques(h.code, idx===habitats.length-1, ()=>renderCorineBlock(container));
    if(sugg) tags.appendChild(sugg);
  });
  container.appendChild(tags);
  container.appendChild(reglet);
  container.appendChild(total);
  refreshTotal();
}

const RARETE_ORDRE = ['CCC','CC','C','AC','AR','R','RR','RRR'];
function rareteRang(entry){
  const i = RARETE_ORDRE.indexOf(entry ? entry['Rareté AlsLor'] : null);
  return i<0 ? RARETE_ORDRE.length : i;
}
// Retrouve une espèce (nom court TAXREF) dans le catalogue choisi, sinon dans le catalogue
// Alsace-Lorraine (celui qui a servi à normaliser les noms).
function trouverEspeceCatalogue(nom){
  const catId = getCatalogueSelected();
  const cat = CATALOGUES[catId];
  const inCat = getFloreReferentiel(catId).find(r=>{
    const n = String(r[cat.nomField]||'');
    return n===nom || n.startsWith(nom+' ');
  });
  if(inCat) return {entry:inCat, catId};
  const al = getFloreReferentiel('alslor').find(r=>r['Taxon valide court']===nom);
  return al ? {entry:al, catId:'alslor'} : null;
}
const especesTypiquesOuvertes = {};
let especesBoxRef = null;
function renderEspecesTypiques(code, ouvertParDefaut, rerender){
  // Le code exact, sinon le code parent le plus proche (ex. 44.311 → 44.31 → 44.3)
  let data = null, codeSource = String(code||'').trim();
  while(codeSource && !(data = corineEspecesCache[codeSource])){
    codeSource = codeSource.includes('.') ? codeSource.replace(/\.?[0-9]$/,'') : '';
  }
  if(!data) return null;
  const alsLor = Object.fromEntries(getFloreReferentiel('alslor').map(r=>[r['Taxon valide court'], r]));
  const trier = noms => noms.slice().sort((a,b)=>rareteRang(alsLor[a])-rareteRang(alsLor[b]));
  // Espèces citées pour le code : les plus communes d'abord ; espèces des sous-codes : les plus
  // souvent citées d'abord (ordre déjà calculé dans le fichier).
  const noms = trier(data.p).concat(data.d);
  if(!noms.length) return null;

  const box = el('div',{class:'especes-typiques'});
  const ouvert = especesTypiquesOuvertes[code] ?? ouvertParDefaut;
  const toggle = el('button',{type:'button', class:'btn btn-ghost especes-typiques-toggle'},
    (ouvert?'▾':'▸')+' 🌿 Espèces typiques ('+noms.length+')'+(codeSource!==code ? ' — d\'après '+codeSource : ''));
  toggle.addEventListener('click', ()=>{ especesTypiquesOuvertes[code] = !ouvert; rerender(); });
  box.appendChild(toggle);
  if(!ouvert) return box;

  box.appendChild(el('div',{class:'hint'},'Touche une espèce pour l\'ajouter au cortège floristique (espèces citées pour ce code d\'abord). Source : descriptions officielles CORINE Biotopes 1997.'));
  const selection = getVal('especes_selection')||[];
  const dejaPresente = nom => selection.some(e=>{
    const c = CATALOGUES[e.catalogue] || CATALOGUES.alslor;
    const n = String(e[c.nomField]||'');
    return n===nom || n.startsWith(nom+' ');
  });
  const LIMITE = 15;
  const tout = especesTypiquesOuvertes[code+'_tout'];
  const chips = el('div',{class:'taglist'});
  noms.slice(0, tout ? noms.length : LIMITE).forEach(nom=>{
    const present = dejaPresente(nom);
    const r = alsLor[nom];
    const rar = r && champFilled(r['Rareté AlsLor']) ? ' · '+r['Rareté AlsLor'] : '';
    const chip = el('button',{type:'button', class:'espece-chip'+(present?' present':'')}, (present?'✓ ':'+ ')+nom+rar);
    chip.addEventListener('click', ()=>{
      if(present){ toast('Déjà dans le cortège'); return; }
      const found = trouverEspeceCatalogue(nom);
      if(!found){ toast('Espèce absente du catalogue chargé'); return; }
      const list = getVal('especes_selection')||[];
      list.push(Object.assign({}, found.entry, {abondante:false, catalogue:found.catId}));
      setVal('especes_selection', list);
      if(especesBoxRef) renderEspecesSearchBlock(especesBoxRef);
      rerender();
    });
    chips.appendChild(chip);
  });
  box.appendChild(chips);
  if(noms.length > LIMITE){
    const plus = el('button',{type:'button', class:'btn btn-ghost especes-typiques-toggle'}, tout ? 'Afficher moins' : 'Afficher les '+(noms.length-LIMITE)+' autres espèces');
    plus.addEventListener('click', ()=>{ especesTypiquesOuvertes[code+'_tout'] = !tout; rerender(); });
    box.appendChild(plus);
  }
  return box;
}

function renderAll(){
  const tabsEl = document.getElementById('tabs');
  const secEl = document.getElementById('sections');
  tabsEl.innerHTML = ''; secEl.innerHTML = '';
  const strip = el('div',{class:'tabs-strip'});
  tabsEl.appendChild(strip);
  SECTIONS.forEach((s,i)=>{
    const btn = el('button',{}, s.title, el('span',{class:'tab-prog'}));
    btn.addEventListener('click', ()=>showSection(s.id));
    btn.dataset.id = s.id;
    btn.style.setProperty('--c', s.accent);
    strip.appendChild(btn);

    const sec = el('div',{class:'section', id:'sec_'+s.id});
    sec.style.setProperty('--accent', s.accent);
    const card = el('div',{class:'card'});
    buildingSectionKeys = new Set(s.essentiels);
    card.appendChild(buildBanner(s, i));
    try{ s.build(card); } finally { SECTION_KEYS[s.id] = buildingSectionKeys; buildingSectionKeys = null; }
    // le bandeau remplace le premier titre quand il le répète (« Identification », « Délimitation »…)
    const h = card.children[1];
    if(h && h.tagName==='H2' && s.title.replace(/^\d+\.\s*/,'').startsWith(h.textContent)) h.remove();

    // Navigation entre les pages
    const nav = el('div',{class:'section-nav'});
    const prev = el('button',{class:'btn btn-outline',type:'button'}, i===0 ? '←' : '← Précédent');
    const next = el('button',{class:'btn btn-primary',type:'button'}, i===SECTIONS.length-1 ? 'Terminer' : 'Suivant →');

    prev.disabled = i===0;
    prev.style.opacity = i===0 ? '.45' : '1';

    prev.addEventListener('click',()=>{
      if(i>0) showSection(SECTIONS[i-1].id);
    });

    next.addEventListener('click',()=>{
      if(i<SECTIONS.length-1) showSection(SECTIONS[i+1].id);
      else terminerFiche();
    });

    nav.appendChild(prev);
    nav.appendChild(next);
    card.appendChild(nav);

    sec.appendChild(card);
    secEl.appendChild(sec);
  });
  strip.appendChild(el('span',{class:'tab-ind'}));
  tabState = null; // nouvelle barre : la pastille se place directement
  showSection(SECTIONS[0].id);
  refreshTabProgress();
  refreshBannerIds();
}
// opts.swipe : arrivée par glissement — pas de fondu (la page est déjà visible) et la position
// de défilement est gérée par le geste.
function showSection(id, opts={}){
  currentSectionId = id;
  document.querySelectorAll('.section').forEach(s=>{
    s.classList.toggle('active', s.id==='sec_'+id);
    s.classList.toggle('fade-in', s.id==='sec_'+id && !opts.swipe);
  });
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  const i = SECTIONS.findIndex(s=>s.id===id);
  moveTabIndicator(i, null, 0, !!opts.swipe);
  if(!opts.swipe) window.scrollTo({top:0, behavior:'instant'});
}

let toastTimer = null;
function toast(msg, ms=1800){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms);
}

// Une fiche sans aucune donnée saisie (hors identifiants techniques / observateur) ne doit pas
// être enregistrée : elle créerait une fiche « vide » dans la liste (ou écraserait une fiche remplie).
function recordHasContent(r){
  return Object.keys(r||{}).some(k=>{
    if(k.charAt(0)==='_' || k.indexOf('observateur')===0) return false;
    const v = r[k];
    if(v==null || v===false || v==='') return false;
    if(Array.isArray(v)) return v.length>0;
    if(typeof v==='object') return Object.keys(v).some(c=>Array.isArray(v[c]) ? v[c].length>0 : !!v[c]);
    return true;
  });
}

// Oublis importants signalés au moment de « Terminer » (l'enregistrement reste possible).
function verifierFiche(){
  const pb = [];
  const v = k => valeurRenseignee(record[k]);
  if(!v('id_num')) pb.push({msg:'Pas d\'ID de fiche', section:'ident'});
  if(!v('x_l93') || !v('y_l93')) pb.push({msg:'Pas de coordonnées GPS', section:'ident'});
  if(!v('date_obs')) pb.push({msg:'Pas de date d\'observation', section:'ident'});
  if(!v('conclusion_zh')) pb.push({msg:'Pas de conclusion « zone humide »', section:'delim'});
  const hab = record.corine_habitats || [];
  if(!hab.length) pb.push({msg:'Aucun habitat CORINE', section:'especes'});
  else {
    const sansPct = hab.filter(h=>h.recouvrement==null || h.recouvrement==='').length;
    const total = hab.reduce((a,h)=>a+(parseFloat(h.recouvrement)||0),0);
    if(sansPct) pb.push({msg:sansPct+' habitat(s) sans recouvrement', section:'especes'});
    else if(total!==100) pb.push({msg:'Recouvrements des habitats : total '+total+' % (au lieu de 100 %)', section:'especes'});
  }
  if(!v('especes_selection')) pb.push({msg:'Cortège floristique vide', section:'especes'});
  return pb;
}
function terminerFiche(){
  const pb = verifierFiche();
  if(!pb.length){ saveRecord(); return; }
  let bg = document.getElementById('checkModal');
  if(bg) bg.remove();
  bg = el('div',{class:'modal-bg show', id:'checkModal'});
  const box = el('div',{class:'modal'});
  const close = ()=>bg.remove();
  const x = el('button',{class:'modal-close', type:'button', 'aria-label':'Fermer'},'✕');
  x.addEventListener('click', close);
  box.appendChild(el('div',{class:'modal-head'}, el('h2',{},'Avant d\'enregistrer'), x));
  box.appendChild(el('p',{class:'hint', style:'font-size:.85rem;'},'Quelques éléments manquent ou sont à vérifier :'));
  const ul = el('ul',{class:'check-list'});
  pb.forEach(p=>{
    const go = el('button',{class:'btn btn-outline', type:'button'},'Compléter');
    go.addEventListener('click', ()=>{ close(); showSection(p.section); });
    ul.appendChild(el('li',{}, el('span',{}, '⚠️ '+p.msg), go));
  });
  box.appendChild(ul);
  const save = el('button',{class:'btn btn-primary', type:'button'},'💾 Enregistrer quand même');

  back.addEventListener('click', close);

function saveRecord(){
  if(!recordHasContent(record)){ toast('Fiche vide : rien à enregistrer'); return; }
  const now = new Date().toISOString();
  const rec = Object.assign({}, record, {
    _id: editingId || record._id || ('zh_'+Date.now()),
    _saved_at: now
  });
  const wasEditing = !!editingId;
  const ficheId = rec._id;

  if(localOnlyMode){
    const list = getLocalRecords();
    const idx = list.findIndex(r=>r._id===ficheId);
    if(idx>-1) list[idx] = rec; else list.push(rec);
    const ok = setLocalRecords(list);
    if(!ok) return; // échec d'écriture déjà signalé par safeLocalSet — ne surtout pas effacer la fiche en cours
  } else {
    if(!firebaseConfigured){ toast('Firebase non configuré — voir firebaseConfig en haut du script'); return; }
    if(!currentUser){ toast('Non connecté'); return; }
    const photosByCategory = rec.photos;
    // Les photos ne doivent PAS aller dans le document Firestore de la fiche (limite de 1 Mo par
    // document, et ce serait redondant) : elles partent vers Firebase Storage via syncFichePhotos,
    // qui met à jour photos_urls sur le document une fois chaque upload terminé.
    // On garde seulement les petites références {id, name, taken_at} (sans image base64) pour
    // pouvoir réafficher les photos stockées sur l'appareil quand on rouvre la fiche.
    const recForFirestore = Object.assign({}, rec);
    delete recForFirestore.photos;
    if(photosByCategory && typeof photosByCategory === 'object'){
      recForFirestore.photos = Object.fromEntries(Object.entries(photosByCategory).map(([cat, arr])=>
        [cat, (arr||[]).filter(p=>p && p.id).map(p=>({id:p.id, name:p.name||'', taken_at:p.taken_at||''}))]));
    }
    // Pas d'attente bloquante sur l'écriture réseau : la persistance hors connexion de Firestore
    // applique le changement localement tout de suite (donc utilisable sans réseau), et synchronise
    // automatiquement en tâche de fond dès que la connexion revient.
    setSyncStatus(navigator.onLine ? 'syncing' : 'offline');
    db.collection('users').doc(currentUser.uid).collection('fiches').doc(ficheId).set(recForFirestore)
      .then(()=> setSyncStatus('synced'))
      .catch(e=>{ console.error('Erreur sauvegarde Firestore :', e); setSyncStatus('error'); });
    syncFichePhotos(ficheId, photosByCategory);
  }

  // La fiche reste affichée après l'enregistrement : elle est désormais liée à son identifiant,
  // donc les modifications suivantes mettront à jour cette même fiche (pas de doublon).
  // Pour commencer un nouveau relevé : bouton "Nouvelle fiche".
  editingId = ficheId;
  record._id = ficheId;
  record._saved_at = now;
  saveDraft();

  toast((wasEditing ? 'Fiche mise à jour' : 'Fiche enregistrée') + (localOnlyMode ? ' sur l\'appareil' : ' — synchronisation automatique'));
  refreshBackupState();
  rappelSauvegarde();
}

function newRecord(){

// Tri de la liste des fiches. Date = date d'observation saisie, sinon date de création de la
// fiche (contenue dans son identifiant interne zh_<horodatage>). Numéro = identifiant de la fiche
// (planche-ID), comparé « naturellement » : 2 avant 10.
function getRecordsSort(){ try{ return localStorage.getItem('zh_records_sort') || 'date_desc'; }catch(e){ return 'date_desc'; } }
function recordDateKey(r){
  const created = parseInt(String(r._id||'').replace(/^zh_/,''),10) || Date.parse(r._saved_at) || 0;
  const obs = r.date_obs ? Date.parse(r.date_obs) : NaN;
  return [isNaN(obs) ? created : obs, created];
}
function sortRecords(list, mode){
  const arr = list.slice();
  const byDate = (a,b)=>{ const ka=recordDateKey(a), kb=recordDateKey(b); return (ka[0]-kb[0]) || (ka[1]-kb[1]); };
  const num = r=>String(r.identifiant || r.id_num || '').trim();
  const byNum = (a,b)=>{
    const na=num(a), nb=num(b);
    if(!na || !nb) return (!na) - (!nb); // fiches sans numéro à la fin
    return na.localeCompare(nb, 'fr', {numeric:true, sensitivity:'base'}) || byDate(a,b);
  };
  if(mode==='date_asc') arr.sort(byDate);
  else if(mode==='num_asc') arr.sort(byNum);
  else if(mode==='num_desc') arr.sort((a,b)=>{ const na=num(a), nb=num(b); return (!na||!nb) ? byNum(a,b) : byNum(b,a); });
  else arr.sort((a,b)=>byDate(b,a));
  return arr;
}

// Nouvelle fiche pré-remplie à partir d'une fiche existante (zones voisines semblables).
// On ne reprend pas ce qui est propre à la zone : ID, coordonnées, photos, sondages, remarques.
const CHAMPS_NON_DUPLIQUES = ['_id','_saved_at','id_num','identifiant','x_l93','y_l93','gps_precision','photos','photos_urls','sondages'];
function dupliquerFiche(r){
  if(!confirm('Créer une nouvelle fiche à partir de « '+(r.identifiant||r._id)+' » ?\n\nRepris : observateur, planches, date, délimitation, fonctions, usages, habitats, espèces, préconisations…\nNon repris : ID, coordonnées, photos, sondages, remarques.\n\nLa fiche en cours non enregistrée sera remplacée.')) return;
  const copie = {};
  Object.keys(r).forEach(k=>{
    if(CHAMPS_NON_DUPLIQUES.includes(k) || k.startsWith('remarques')) return;
    copie[k] = JSON.parse(JSON.stringify(r[k]));
  });
  record = copie; editingId = null;
  saveDraft();
  renderAll(); closeModal(); refreshGpsChip();
  toast('Copie créée — saisis l\'ID et localise la nouvelle zone', 3500);
}

// ---- Sauvegarde : date du dernier export ZIP complet, fiches modifiées depuis
function getLastBackup(){ try{ return localStorage.getItem('zh_last_backup') || null; }catch(e){ return null; } }
function fichesNonSauvegardees(){
  const last = getLastBackup();
  return getRecords().filter(r=>!last || (r._saved_at||'') > last);
}
function depuis(iso){
  const j = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  return j<=0 ? 'aujourd\'hui' : j===1 ? 'hier' : 'il y a '+j+' jours';
}
function refreshBackupState(){
  const n = fichesNonSauvegardees().length;
  const btn = document.getElementById('btnRecords');
  if(btn) btn.classList.toggle('needs-backup', n>0);
  const ban = document.getElementById('backupBanner');
  if(!ban) return;
  ban.innerHTML = '';
  const last = getLastBackup();
  if(!getRecords().length){ ban.className = 'backup-banner'; return; }
  if(n===0){
    ban.className = 'backup-banner ok';
    ban.appendChild(el('span',{}, '✓ Sauvegarde à jour (dernier export complet : '+depuis(last)+')'));
  } else {
    ban.className = 'backup-banner warn';
    ban.appendChild(el('span',{}, '⚠️ '+n+' fiche'+(n>1?'s':'')+' non sauvegardée'+(n>1?'s':'')+' — '+(last ? 'dernier export complet : '+depuis(last) : 'aucun export complet pour l\'instant')+'. Les fiches ne sont que sur cet appareil.'));
    const b = el('button',{class:'btn btn-primary', type:'button'},'📦 Sauvegarder (ZIP)');
    b.addEventListener('click', exportPhotosZip);
    ban.appendChild(b);
  }
}
// Rappel discret, au plus une fois par jour, s'il y a des fiches non sauvegardées depuis plus d'un jour
function rappelSauvegarde(){
  const n = fichesNonSauvegardees().length;
  const last = getLastBackup();
  if(!n || (last && Date.now()-Date.parse(last) < 86400000)) return;
  const today = new Date().toISOString().slice(0,10);
  try{
    if(localStorage.getItem('zh_backup_reminder') === today) return;
    localStorage.setItem('zh_backup_reminder', today);
  }catch(e){}
  setTimeout(()=>toast('💾 '+n+' fiche'+(n>1?'s':'')+' à sauvegarder : 📋 → « Sauvegarder (ZIP) »', 4500), 2000);
}

// Calcule la liste des fichiers photo d'une fiche (locaux dans IndexedDB, ou déjà sur Firebase
// Storage) avec un nom de fichier stable — utilisé à la fois pour la colonne "photos_fichiers"
// des exports CSV/GeoJSON (juste les noms, lisibles) et pour construire le ZIP réel des images.
function photoFileList(r){
  const files = [];
  const base = ((r.identifiant || 'fiche') + '_' + String(r._id||'').slice(-6)).replace(/[^a-zA-Z0-9_-]+/g,'_');
  if(r.photos && typeof r.photos === 'object' && !Array.isArray(r.photos)){
    Object.entries(r.photos).forEach(([category, arr])=>{
      (arr||[]).forEach((photo, idx)=>{
        if(photo.id){
          files.push({filename: `${base}_${category}_${idx+1}.jpg`, source:'idb', id: photo.id});
        } else if(photo.data){
          files.push({filename: `${base}_${category}_${idx+1}.jpg`, source:'legacy_data', data: photo.data});
        }
      });
    });
  }
  if(Array.isArray(r.photos_urls)){
    r.photos_urls.forEach((photo, idx)=>{
      const cat = photo.category || 'photo';
      files.push({filename: `${base}_${cat}_${idx+1}.jpg`, source:'remote', url: photo.url});
    });
  }
  return files;
}

// Retire les champs photo bruts (références IndexedDB / liste d'URLs) des propriétés exportées
// en CSV/GeoJSON — une image n'a pas sa place dans une cellule de tableur — et les remplace par
// la liste des noms de fichiers correspondants dans l'export ZIP (voir exportPhotosZip).
function sanitizeRecordForTabularExport(r){
  const files = photoFileList(r);
  const clean = Object.assign({}, r);
  delete clean.photos;
  delete clean.photos_urls;
  clean.photos_fichiers = files.map(f=>f.filename).join(' | ');
  const legendes = [];
  Object.entries((r.photos && typeof r.photos==='object' && !Array.isArray(r.photos)) ? r.photos : {}).forEach(([cat, arr])=>{
    (arr||[]).forEach(ph=>{
      const f = files.find(x=>x.id && x.id===ph.id);
      if(ph && ph.legende) legendes.push((f ? f.filename : cat)+' : '+ph.legende);
    });
  });
  clean.photos_legendes = legendes.join(' | ');
  if(Array.isArray(clean.corine_habitats)){
    clean.corine_habitats = clean.corine_habitats.map(h=>
      h.code + (h.libelle ? ' '+h.libelle : '') + (h.recouvrement!=null && h.recouvrement!=='' ? ' '+h.recouvrement+'%' : '')
    ).join(' | ');
  }
  return clean;
}

function downloadBlob(filename, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function buildCsvContent(list){
  const cleanList = list.map(sanitizeRecordForTabularExport);
  const keys = Array.from(cleanList.reduce((set,r)=>{ Object.keys(r).forEach(k=>set.add(k)); return set; }, new Set()));
  const rows = [keys.join(';')];
  cleanList.forEach(r=>{
    rows.push(keys.map(k=>{
      let v = r[k];
      if(Array.isArray(v)) v = v.join(' | ');
      if(v==null) v = '';
      v = String(v).replace(/;/g,',').replace(/\n/g,' ');
      return v;
    }).join(';'));
  });
  return rows.join('\n');
}

async function exportPhotosZip(){
  const list = getRecords();
  const allFiles = list.flatMap(photoFileList);
  if(list.length===0){ toast('Aucune fiche à exporter'); return; }
  if(typeof JSZip === 'undefined'){ toast('Bibliothèque ZIP indisponible (pas de réseau au premier chargement ?)'); return; }

  toast('Préparation du ZIP…');
  const zip = new JSZip();
  zip.file('fiches.csv', buildCsvContent(list));
  // Fichier de restauration : les fiches complètes, chaque photo pointant vers son fichier du ZIP
  const backup = list.map(r=>{
    const copy = JSON.parse(JSON.stringify(r));
    const byId = Object.fromEntries(photoFileList(r).filter(f=>f.source==='idb').map(f=>[f.id, f.filename]));
    Object.values(copy.photos||{}).forEach(arr=>(arr||[]).forEach(ph=>{ if(ph && byId[ph.id]) ph.file = byId[ph.id]; }));
    return copy;
  });
  zip.file('sauvegarde_palustris.json', JSON.stringify({app:'palustris', format:1, exported_at:new Date().toISOString(), records:backup}));

  let failed = 0;
  for(const f of allFiles){
    try{
      if(f.source==='idb'){
        const blob = await getPhotoBlob(f.id);
        if(blob) zip.file(f.filename, blob);
        else failed++;
      } else if(f.source==='legacy_data'){
        const base64 = (f.data||'').split(',')[1];
        if(base64) zip.file(f.filename, base64, {base64:true});
        else failed++;
      } else {
        const res = await fetch(f.url);
        if(!res.ok) throw new Error('http '+res.status);
        const blob = await res.blob();
        zip.file(f.filename, blob);
      }
    }catch(e){
      console.error('Photo non incluse dans le ZIP :', f.filename, e);
      failed++;
    }
  }
  const blob = await zip.generateAsync({type:'blob'});
  downloadBlob('export_zones_humides_'+Date.now()+'.zip', blob);
  try{ localStorage.setItem('zh_last_backup', new Date().toISOString()); }catch(e){}
  refreshBackupState();
  toast(failed
    ? `ZIP téléchargé (fiches.csv + photos) — ${failed} photo(s) indisponible(s) (hors connexion ?)`
    : 'ZIP téléchargé : fiches.csv + '+allFiles.length+' photo(s)');
}

// Restaure un ZIP « Export complet » : ajoute les fiches absentes de l'appareil et remplace celles
// dont la version sauvegardée est plus récente ; les photos sont remises dans le stockage local.
async function restaurerSauvegarde(file){
  if(!localOnlyMode){ toast('Restauration disponible en mode local uniquement'); return; }
  if(typeof JSZip === 'undefined'){ toast('Bibliothèque ZIP indisponible (ouvre l\'appli une fois avec du réseau)'); return; }
  try{
    const zip = await JSZip.loadAsync(file);
    const jf = zip.file('sauvegarde_palustris.json');
    if(!jf){ toast('Ce ZIP ne contient pas de sauvegarde Palustris (export antérieur à la version 15 ?)', 4000); return; }
    const data = JSON.parse(await jf.async('string'));
    const recs = Array.isArray(data.records) ? data.records : [];
    const list = getLocalRecords();
    let ajout = 0, maj = 0, ignore = 0, photos = 0;
    for(const r of recs){
      if(!r || !r._id) continue;
      const idx = list.findIndex(x=>x._id===r._id);
      if(idx>-1 && (list[idx]._saved_at||'') >= (r._saved_at||'')){ ignore++; continue; }
      for(const arr of Object.values(r.photos||{})){
        for(const ph of (arr||[])){
          if(ph && ph.file && zip.file(ph.file)){
            if(!ph.id) ph.id = newPhotoId();
            await savePhotoBlob(ph.id, await zip.file(ph.file).async('blob'));
            photos++;
          }
          if(ph) delete ph.file;
        }
      }
      if(idx>-1){ list[idx] = r; maj++; } else { list.push(r); ajout++; }
    }
    if(!setLocalRecords(list)) return;
    refreshBackupState();
    if(document.getElementById('recordsModal').classList.contains('show')) openRecordsModal();
    toast(`Restauration : ${ajout} fiche(s) ajoutée(s), ${maj} mise(s) à jour, ${ignore} déjà à jour — ${photos} photo(s)`, 5000);
  }catch(e){
    console.error('Restauration échouée :', e);
    toast('Restauration impossible : fichier illisible', 4000);
  }
}

function exportGeojson(){
  const list = getRecords();
  const features = list.map(r=>{
    let geom = null;
    if(r.x_l93 && r.y_l93){
      const wgs = l93ToWgs84(parseFloat(r.x_l93), parseFloat(r.y_l93));
      geom = {type:'Point', coordinates:[wgs.lon, wgs.lat]};
    }
    const clean = sanitizeRecordForTabularExport(r);
    return {
      type:'Feature',
      geometry: geom,
      properties: Object.fromEntries(Object.entries(clean).map(([k,v])=>[k, Array.isArray(v)?JSON.stringify(v):v]))
    };
  });
  const fc = {type:'FeatureCollection', name:'zones_humides', crs:{type:'name', properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}}, features};
  download('zones_humides_'+Date.now()+'.geojson', JSON.stringify(fc, null, 2), 'application/geo+json');
  toast('Export GeoJSON téléchargé (géométrie WGS84, X/Y L93 en attribut)');
}

function exportCsv(){
  const list = getRecords();
  if(list.length===0){ toast('Aucune fiche à exporter'); return; }
  download('zones_humides_'+Date.now()+'.csv', buildCsvContent(list), 'text/csv');
  toast('Export CSV téléchargé');
}

// Glisser vers la gauche → rubrique suivante ; vers la droite → rubrique précédente.
// Effet « carrousel » : pendant le geste, la rubrique voisine apparaît collée à la rubrique
// actuelle et les deux suivent le doigt (on voit les deux tant qu'on maintient). Au lâcher, la
// voisine termine son entrée, ou tout revient en place si le geste est trop court.
// La direction est décidée dès les premiers pixels : un geste vertical reste un défilement
// normal. Pas de glissement depuis le champ en cours de saisie ni une zone défilant horizontalement.
(function initSwipeSections(){
  const zone = document.getElementById('sections');
  const GAP = 16;
  let g = null;      // geste en cours
  let busy = false;  // animation de fin en cours
  const idx = ()=> SECTIONS.findIndex(s=>s.id===currentSectionId);
  const secOf = i => (i>=0 && i<SECTIONS.length) ? document.getElementById('sec_'+SECTIONS[i].id) : null;
  function place(sec, x, anim){
    sec.style.transition = anim ? 'transform '+anim+'ms cubic-bezier(.2,.75,.3,1)' : 'none';
    sec.style.transform = 'translate3d('+x+'px,0,0)';
  }
  function reset(sec){
    if(!sec) return;
    ['transition','transform','position','top','left','width','display','animation'].forEach(k=>sec.style[k]='');
  }
  // Affiche la rubrique voisine en superposition, alignée juste sous la barre des rubriques
  // (là où elle sera visible une fois arrivée).
  function showNeighbour(nb, cur){
    const nav = document.getElementById('tabs').getBoundingClientRect();
    const zoneTop = zone.getBoundingClientRect().top;
    const curTop = cur.getBoundingClientRect().top;
    const top = Math.max(curTop, nav.bottom + 10) - zoneTop;
    nb.classList.remove('fade-in');
    Object.assign(nb.style, {display:'block', position:'absolute', top:top+'px', left:cur.offsetLeft+'px', width:cur.offsetWidth+'px'});
  }
  zone.addEventListener('touchstart', e=>{
    g = null;
    if(busy || e.touches.length!==1) return;
    const t = e.target;
    if(t.closest('textarea, [contenteditable], input[type=range], .no-swipe') || (t === document.activeElement && t.matches('input'))) return;
    for(let n=t; n && n!==zone; n=n.parentElement){
      if(n.scrollWidth > n.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return;
    }
    const p = e.touches[0];
    g = {x0:p.clientX, y0:p.clientY, dir:null, dx:0, lastX:p.clientX, lastT:performance.now(), v:0,
         i:idx(), cur:secOf(idx()), nb:null, side:0};
  }, {passive:true});
  zone.addEventListener('touchmove', e=>{
    if(!g || !g.cur) return;
    const p = e.touches[0];
    const dx = p.clientX - g.x0, dy = p.clientY - g.y0;
    if(!g.dir){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      g.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if(g.dir!=='h') return;
    e.preventDefault(); // geste horizontal : pas de défilement vertical pendant le glissement
    const now = performance.now();
    g.v = (p.clientX - g.lastX) / Math.max(1, now - g.lastT);
    g.lastX = p.clientX; g.lastT = now;

    const side = dx < 0 ? 1 : -1; // 1 = suivante (arrive par la droite)
    if(side !== g.side){
      if(g.nb){ reset(g.nb); g.nb.classList.remove('swipe-peek'); }
      g.side = side;
      g.nb = secOf(g.i + side);
      if(g.nb){ showNeighbour(g.nb, g.cur); g.nb.classList.add('swipe-peek'); }
    }
    g.dx = g.nb ? dx : dx/3; // pas de voisine (1re / dernière rubrique) : résistance élastique
    const w = g.cur.offsetWidth + GAP;
    place(g.cur, g.dx, 0);
    if(g.nb) place(g.nb, g.dx + side*w, 0);
    if(g.nb) moveTabIndicator(g.i, g.i+side, Math.min(1, Math.abs(g.dx)/w), true);
  }, {passive:false});
  function fin(){
    if(!g || g.dir!=='h'){ g = null; return; }
    const {cur, nb, dx, v, side, i} = g; g = null;
    const w = cur.offsetWidth + GAP;
    const fast = Math.abs(v) > 0.35 && Math.abs(dx) > 30 && Math.sign(v)===Math.sign(dx);
    const ok = nb && (Math.abs(dx) > cur.offsetWidth*0.3 || fast);
    busy = true;
    // Une seule boucle d'animation déplace la page, la voisine, la pastille et la bande
    // d'onglets : même durée, même courbe, même image — aucun décalage possible entre elles.
    const x0 = dx, x1 = ok ? -side*w : 0;
    const t0 = nb ? Math.min(1, Math.abs(dx)/w) : 0, t1 = ok ? 1 : 0;
    const start = performance.now();
    const frame = now=>{
      const k = easeOut(Math.min(1, (now - start)/TAB_D));
      const x = x0 + (x1 - x0)*k;
      place(cur, x, 0);
      if(nb){ place(nb, x + side*w, 0); moveTabIndicator(i, i+side, t0 + (t1 - t0)*k, true); }
      else moveTabIndicator(i, null, 0, true);
      if(k < 1){ requestAnimationFrame(frame); return; }
      if(!ok){
        reset(cur); if(nb){ reset(nb); nb.classList.remove('swipe-peek'); }
        busy = false; return;
      }
      // La voisine devient la rubrique affichée, sans saut : on garde sa position à l'écran.
      const before = nb.getBoundingClientRect().top;
      reset(cur); reset(nb); nb.classList.remove('swipe-peek');
      showSection(SECTIONS[i+side].id, {swipe:true});
      const after = nb.getBoundingClientRect().top;
      if(Math.abs(after - before) > 0.5) window.scrollTo({top: window.scrollY + (after - before), behavior:'instant'});
      busy = false;
    };
    requestAnimationFrame(frame);
  }
  zone.addEventListener('touchend', fin, {passive:true});
  zone.addEventListener('touchcancel', fin, {passive:true});
})();

// Courbes de niveau en filigrane dans l'en-tête (dessinées, pas d'image à charger)
function drawContours(){
  const c = document.getElementById('headContours');
  if(!c) return;
  const box = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(!box.width) return;
  c.width = box.width*dpr; c.height = box.height*dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.strokeStyle = 'rgba(60,95,72,.17)'; g.lineWidth = 1;
  const cx = box.width*0.62, cy = box.height*1.05;
  for(let k=1; k<=10; k++){
    g.beginPath();
    for(let a=0; a<=Math.PI*2+0.01; a+=0.05){
      const rr = k*15 * (1 + .18*Math.sin(3*a + k*.7) + .08*Math.sin(5*a - k));
      const px = cx + Math.cos(a)*rr*2.2, py = cy + Math.sin(a)*rr*.7;
      a===0 ? g.moveTo(px,py) : g.lineTo(px,py);
    }
    g.stroke();
  }
}
window.addEventListener('resize', drawContours);
requestAnimationFrame(drawContours);
